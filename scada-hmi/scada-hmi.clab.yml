name: scada-hmi

mgmt:
  network: clab-scada-hmi
  ipv4-subnet: 172.111.20.0/24
  ipv6-subnet: 3fff:172:111:20::/64

topology:
  nodes:
    # Level 0 and 1: the process model and the soft PLC.
    tank:
      kind: linux
      image: modbus-lab:3.12.1
      mgmt-ipv4: 172.111.20.10
      cmd: python /lab/tank_plant.py

    plc:
      kind: linux
      image: ghcr.io/autonomy-logic/openplc-runtime:v4.3.1
      mgmt-ipv4: 172.111.20.11
      cap-add:
        - SYS_NICE
        - SYS_RESOURCE
      ports:
        - 127.0.0.1:8443:8443

    # Level 2: the operator interface.
    hmi:
      kind: linux
      image: frangoteam/fuxa:1.3.5
      mgmt-ipv4: 172.111.20.20
      ports:
        - 127.0.0.1:1881:1881

    # Level 3: the historian and the view of it.
    poller:
      kind: linux
      image: ics-poller:1.0.0
      mgmt-ipv4: 172.111.20.30
      env:
        TANK_HOST: 172.111.20.10
        TANK_PORT: "5020"
        INFLUX_URL: http://172.111.20.31:8086
        INFLUX_ORG: lab
        INFLUX_BUCKET: process
        INFLUX_TOKEN: lab-token-not-a-secret
        POLL_INTERVAL: "1"

    historian:
      kind: linux
      image: influxdb:2.7.12
      mgmt-ipv4: 172.111.20.31
      env:
        DOCKER_INFLUXDB_INIT_MODE: setup
        DOCKER_INFLUXDB_INIT_USERNAME: lab
        DOCKER_INFLUXDB_INIT_PASSWORD: lab-password-not-a-secret
        DOCKER_INFLUXDB_INIT_ORG: lab
        DOCKER_INFLUXDB_INIT_BUCKET: process
        DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: lab-token-not-a-secret
      ports:
        - 127.0.0.1:8086:8086

    dashboard:
      kind: linux
      image: grafana/grafana:11.3.0
      mgmt-ipv4: 172.111.20.32
      env:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
        GF_AUTH_DISABLE_LOGIN_FORM: "true"
        GF_ANALYTICS_REPORTING_ENABLED: "false"
      binds:
        - grafana/provisioning:/etc/grafana/provisioning:ro
        - grafana/dashboards:/var/lib/grafana/dashboards:ro
      ports:
        - 127.0.0.1:3000:3000
